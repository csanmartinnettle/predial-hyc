name: Compilar APK Android

# Cada cambio que se sube a main genera un APK nuevo y lo publica en "Releases".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: HyCPredial2026   # clave del archivo android-signing/predial-hyc.jks (repositorio privado)
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Armar la app web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1b223d' --iconBackgroundColorDark '#1b223d' --splashBackgroundColor '#1b223d' --splashBackgroundColorDark '#1b223d'
          npx cap sync android

      - name: Número de versión
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firmar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks android-signing/predial-hyc.jks --ks-key-alias predial \
            --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --out Predial-HyC.apk aligned.apk
          "$BT/apksigner" verify Predial-HyC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Predial-HyC-${{ env.VERSION }}
          path: Predial-HyC.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Predial-HyC.apk \
            --title "Predial H&C $VERSION" \
            --notes "Descarga **Predial-HyC.apk** en el teléfono Android y ábrelo para instalar o actualizar la app."
